type User @entity {
  id: ID! # Wallet address
  username: String
  createdAt: BigInt!
}

type Tab @entity {
  id: ID! # tabId bytes32 hex
  creator: Bytes!
  title: String!
  members: [Bytes!]!
  shares: [BigInt!]!
  settled: Boolean!
  paidCount: BigInt!
  createdAt: BigInt!
  payments: [TabPayment!]! @derivedFrom(field: "tab")
}

type TabPayment @entity {
  id: ID! # tabId + member address
  tab: Tab!
  member: Bytes!
  amount: BigInt!
  timestamp: BigInt!
}

type Transfer @entity {
  id: ID!
  from: Bytes!
  to: Bytes!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type SavingsPot @entity {
  id: ID! # potId
  creator: Bytes!
  name: String!
  targetAmount: BigInt!
  totalDeposited: BigInt!
  unlockTime: BigInt!
  createdAt: BigInt!
  deposits: [PotDeposit!]! @derivedFrom(field: "pot")
  withdrawals: [PotWithdrawal!]! @derivedFrom(field: "pot")
}

type PotDeposit @entity {
  id: ID! # txHash + logIndex
  pot: SavingsPot!
  user: Bytes!
  amount: BigInt!
  timestamp: BigInt!
}

type PotWithdrawal @entity {
  id: ID! # txHash + logIndex
  pot: SavingsPot!
  user: Bytes!
  amount: BigInt!
  timestamp: BigInt!
}
