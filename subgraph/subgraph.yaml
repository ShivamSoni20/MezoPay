specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UsernameRegistry
    network: mezo-testnet
    source:
      address: "0x8eB4E69A550Dc63BaB674469eBC516d893793de8"
      abi: UsernameRegistry
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
      abis:
        - name: UsernameRegistry
          file: ./abis/UsernameRegistry.json
      eventHandlers:
        - event: UsernameRegistered(indexed string,indexed address)
          handler: handleUsernameRegistered
        - event: UsernameReleased(indexed string,indexed address)
          handler: handleUsernameReleased
      file: ./src/mapping.ts

  - kind: ethereum
    name: SplitManager
    network: mezo-testnet
    source:
      address: "0x9cd6D4A92939A1b93fBb3c848c2cF3e9f09D4C10"
      abi: SplitManager
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tab
        - TabPayment
      abis:
        - name: SplitManager
          file: ./abis/SplitManager.json
      eventHandlers:
        - event: TabCreated(indexed bytes32,indexed address,string,uint256)
          handler: handleTabCreated
        - event: TabSettled(indexed bytes32,uint256)
          handler: handleTabSettled
        - event: MemberPaid(indexed bytes32,indexed address,uint256)
          handler: handleMemberPaid
      file: ./src/mapping.ts

  - kind: ethereum
    name: MUSD
    network: mezo-testnet
    source:
      address: "0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503"
      abi: MUSD
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: MUSD
          file: ./abis/MUSD.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
