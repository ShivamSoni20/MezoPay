specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: UsernameRegistry
    network: mezo-testnet
    source:
      address: "0x8eB4E69A550Dc63BaB674469eBC516d893793de8"
      abi: UsernameRegistry
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
      abis:
        - name: UsernameRegistry
          file: UsernameRegistry\abis\UsernameRegistry.json
      eventHandlers:
        - event: UsernameRegistered(indexed string,indexed address)
          handler: handleUsernameRegistered
        - event: UsernameReleased(indexed string,indexed address)
          handler: handleUsernameReleased
      file: UsernameRegistry\UsernameRegistry.wasm
  - kind: ethereum
    name: SplitManager
    network: mezo-testnet
    source:
      address: "0x11B5B5058C85CB446e4d68765B24661Da58BE83A"
      abi: SplitManager
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tab
        - TabPayment
      abis:
        - name: SplitManager
          file: SplitManager\abis\SplitManager.json
      eventHandlers:
        - event: TabCreated(indexed bytes32,indexed address,string,uint256)
          handler: handleTabCreated
        - event: TabSettled(indexed bytes32,uint256)
          handler: handleTabSettled
        - event: MemberPaid(indexed bytes32,indexed address,uint256)
          handler: handleMemberPaid
      file: UsernameRegistry\UsernameRegistry.wasm
  - kind: ethereum
    name: MUSD
    network: mezo-testnet
    source:
      address: "0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503"
      abi: MUSD
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: MUSD
          file: MUSD\abis\MUSD.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: UsernameRegistry\UsernameRegistry.wasm
  - kind: ethereum
    name: SavingsPot
    network: mezo-testnet
    source:
      address: "0xCEB877c8dD2f67A77353790d961Ee56fF7F1a4e4"
      abi: SavingsPot
      startBlock: 13148340
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SavingsPot
        - PotDeposit
        - PotWithdrawal
      abis:
        - name: SavingsPot
          file: SavingsPot\abis\SavingsPot.json
      eventHandlers:
        - event: PotCreated(indexed bytes32,string,uint256,uint256)
          handler: handlePotCreated
        - event: Deposited(indexed bytes32,indexed address,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed bytes32,indexed address,uint256)
          handler: handleWithdrawn
      file: UsernameRegistry\UsernameRegistry.wasm
